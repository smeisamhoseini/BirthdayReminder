<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>یادآور تولد</title>
<script src="xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#6b7385;--ac:#4f46e5;--bd:#e3e6ee;--hl:#fff4d6}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1c212c;--tx:#e9ecf3;--mu:#98a0b3;--ac:#8b85ff;--bd:#2d3444;--hl:#3a3216}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;padding:16px;max-width:900px;margin-inline:auto}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 10px}
.mu{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select,input,button{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button,.btn{background:var(--ac);color:#fff;border:0;cursor:pointer}
.item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}
.item:first-of-type{border-top:0}
.item.today{background:var(--hl);border-radius:8px;padding-inline:8px}
.n{font-weight:700}.badge{white-space:nowrap;font-size:13px;color:var(--ac);font-weight:700}
.empty{color:var(--mu);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button.chip{cursor:pointer;color:var(--ac)}
@media print{.noprint,.cf{display:none!important}body{background:#fff;color:#000}.card{break-inside:avoid}}
.chip{background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:2px 10px;font-size:12.5px}
.banner{background:var(--hl);border:2px dashed var(--ac);border-radius:14px;padding:14px;margin:12px 0;font-size:18px;font-weight:700;text-align:center;animation:pop 1.2s ease-in-out infinite alternate}
@keyframes pop{to{transform:scale(1.02)}}
.cf{position:fixed;top:-30px;font-size:22px;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style>
</head>
<body>
<h1>🎂 یادآور تولد</h1>
<div class="mu" id="today"></div>

<div class="card noprint">
  <div class="row">
    <label class="btn" style="padding:6px 12px;border-radius:8px;cursor:pointer">انتخاب فایل اکسل<input type="file" id="file" accept=".xlsx,.xls" hidden></label>
    <span class="mu" id="status">در حال تلاش برای خواندن خودکار فایل اکسل کنار صفحه...</span>
    <input id="q" placeholder="🔍 جستجوی نام..." style="margin-inline-start:auto">
    <button onclick="window.print()">🖨️ چاپ</button>
  </div>
  <div class="row" id="map" style="margin-top:10px;display:none">
    <label>نام: <select id="cName"></select></label>
    <label>نام خانوادگی: <select id="cFam"></select></label>
    <label>تاریخ تولد: <select id="cDate"></select></label>
    <label>توضیحات: <select id="cDesc"></select></label>
    <label>بازه «پیش رو» (روز): <input type="number" id="days" value="30" min="1" max="365" style="width:70px"></label>
    <label>تقویم قمری: <select id="cal"><option value="islamic-umalqura">ام‌القری</option><option value="islamic-civil">civil</option><option value="islamic">نجومی</option></select></label>
    <label>تعدیل (روز): <select id="off"><option value="-1">−۱</option><option value="0" selected>۰</option><option value="1">+۱</option></select></label>
  </div>
</div>

<div class="tabs noprint"><button data-v="list" class="on">🎂 تولدها</button><button data-v="year">📅 تقویم سال</button><button data-v="stats">📊 آمار مدرسه</button></div>
<div id="out"></div>

<script>
/* ---------- تبدیل تاریخ شمسی/میلادی (الگوریتم jalaali) ---------- */
const div=(a,b)=>~~(a/b), mod=(a,b)=>a-~~(a/b)*b;
const BR=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function jalCal(jy){let gy=jy+621,leapJ=-14,jp=BR[0],jm,jump,i;
 for(i=1;i<BR.length;i++){jm=BR[i];jump=jm-jp;if(jy<jm)break;leapJ+=div(jump,33)*8+div(mod(jump,33),4);jp=jm}
 let n=jy-jp;leapJ+=div(n,33)*8+div(mod(n,33)+3,4);
 if(mod(jump,33)===4&&jump-n===4)leapJ++;
 const leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150, march=20+leapJ-leapG;
 if(jump-n<6)n=n-jump+div(jump+4,33)*33;
 let leap=mod(mod(n+1,33)-1,4);if(leap===-1)leap=4;
 return{leap,gy,march}}
function g2d(gy,gm,gd){let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;
 return d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752}
function d2gy(jdn){let j=4*jdn+139361631;j+=div(div(4*jdn+183187720,146097)*3,4)*4-3908;
 const i=div(mod(j,1461),4)*5+308,gm=mod(div(i,153),12)+1;return div(j,1461)-100100+div(8-gm,6)}
function j2d(jy,jm,jd){const r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1}
function d2j(jdn){const gy=d2gy(jdn);let jy=gy-621,r=jalCal(jy),k=jdn-g2d(gy,3,r.march),jm,jd;
 if(k>=0){if(k<=185){jm=1+div(k,31);jd=mod(k,31)+1;return{jy,jm,jd}}k-=186}
 else{jy--;k+=179;if(r.leap===1)k++}
 jm=7+div(k,30);jd=mod(k,30)+1;return{jy,jm,jd}}
const isLeap=y=>jalCal(y).leap===0;
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WD=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);

/* ---------- امروز ---------- */
const now=new Date(), todayJdn=g2d(now.getFullYear(),now.getMonth()+1,now.getDate());
const T=d2j(todayJdn), wdIdx=mod(todayJdn+2,7);
document.getElementById('today').textContent=`امروز: ${WD[wdIdx]} ${fa(T.jd)} ${MONTHS[T.jm-1]} ${fa(T.jy)}`;

/* ---------- خواندن اکسل ---------- */
let headers=[],data=[];
const $=id=>document.getElementById(id);
const normDigits=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));

function buf2b64(b){let s='';const u=new Uint8Array(b);for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
function b642buf(t){const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}
let lastEv='';
function pushEvents(all){ // ارسال تولدهای پیش رو به اندروید برای اعلان روزانه
  if(!window.Android||!Android.setEvents)return;
  const iso=j=>new Date((j-2440588)*864e5).toISOString().slice(0,10),ev=[];
  for(const p of all){
    ev.push({d:iso(p.next),t:p.name+' ('+fa(p.age)+' ساله)'});
    const o=nextOcc(p.bm,p.bd,p.by+p.age+1);
    ev.push({d:iso(o.jdn),t:p.name+' ('+fa(p.age+1)+' ساله)'});
  }
  const j=JSON.stringify(ev);if(j!==lastEv){lastEv=j;Android.setEvents(j)}
}
function load(buf){
  const wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  headers=rows[0].map(h=>String(h).trim());
  data=rows.slice(1).filter(r=>r.some(c=>c!==''));
  setupMap();$('status').textContent=`${fa(data.length)} ردیف خوانده شد.`;render();
}
function guess(fn){const i=headers.findIndex(fn);return i}
function setupMap(){
  const opts=['<option value="-1">— ندارد —</option>'].concat(headers.map((h,i)=>`<option value="${i}">${h||'ستون '+fa(i+1)}</option>`)).join('');
  ['cName','cFam','cDate','cDesc'].forEach(id=>$(id).innerHTML=opts);
  let d=guess(h=>/تولد|تاریخ|date|birth/i.test(h));
  if(d<0)d=headers.findIndex((_,i)=>data.slice(0,5).some(r=>/^\d{8}$/.test(normDigits(r[i]).trim())));
  $('cDate').value=d;
  const f=guess(h=>/خانوادگی|family|last/i.test(h));
  $('cFam').value=f;
  $('cName').value=guess((h,i)=>i!==f&&i!==d&&/نام|name|first/i.test(h));
  $('cDesc').value=guess(h=>/توضیح|desc|note|یادداشت/i.test(h));
  $('map').style.display='flex';
}
['cName','cFam','cDate','cDesc','days','cal','off'].forEach(id=>$(id).addEventListener('change',render));
const HM=['محرم','صفر','ربیع‌الاول','ربیع‌الثانی','جمادی‌الاول','جمادی‌الثانی','رجب','شعبان','رمضان','شوال','ذیقعده','ذیحجه'];
function hijri(jdn){
  try{
    const d=new Date((jdn+(+$('off').value)-2440588)*864e5);
    const p=Object.fromEntries(new Intl.DateTimeFormat('en-u-ca-'+$('cal').value+'-nu-latn',{day:'numeric',month:'numeric',year:'numeric',timeZone:'UTC'}).formatToParts(d).map(x=>[x.type,x.value]));
    return `${fa(p.day)} ${HM[+p.month-1]} ${fa(p.year)}`;
  }catch(e){return ''}
}

/* ---------- محاسبه ---------- */
function nextOcc(bm,bd,fromYear){ // jdn و سال شمسی تولد بعدی
  let y=fromYear;
  const dd=(bm===12&&bd===30&&!isLeap(y))?29:bd;
  return{jdn:j2d(y,bm,dd),y}
}
function people(){
  const c=id=>+$(id).value,dc=c('cDate'),out=[];
  if(dc<0)return out;
  for(const r of data){
    const s=normDigits(r[dc]).replace(/\D/g,'');
    if(s.length!==8)continue;
    const by=+s.slice(0,4),bm=+s.slice(4,6),bd=+s.slice(6,8);
    if(bm<1||bm>12||bd<1||bd>31)continue;
    const name=[c('cName')>=0?r[c('cName')]:'',c('cFam')>=0?r[c('cFam')]:''].join(' ').trim()||'(بدون نام)';
    const desc=c('cDesc')>=0?String(r[c('cDesc')]).trim():'';
    let o=nextOcc(bm,bd,T.jy);if(o.jdn<todayJdn)o=nextOcc(bm,bd,T.jy+1);
    out.push({name,desc,by,bm,bd,next:o.jdn,age:o.y-by,left:o.jdn-todayJdn,bwd:WD[mod(j2d(by,bm,bd)+2,7)],bj:j2d(by,bm,bd)});
  }
  const q=$('q').value.trim();
  return q?out.filter(p=>p.name.includes(q)):out;
}
function item(p){
  const when=p.left===0?'امروز 🎉':p.left===1?'فردا':`${fa(p.left)} روز دیگر`;
  return `<div class="item ${p.left===0?'today':''}"><div><div class="n">${p.name}</div>
  <div class="mu">${fa(p.bd)} ${MONTHS[p.bm-1]} · ${fa(p.age)} ساله می‌شود${p.desc?' · '+p.desc:''}</div>
  <div class="mu">متولد ${fa(p.by)}/${fa(p.bm)}/${fa(p.bd)}، روز ${p.bwd}</div>
  <div class="mu">تاریخ قمری تولد: ${hijri(p.bj)}</div>
  <div class="chips">${fun(p)}</div></div>
  <div class="badge">${when}<div class="mu" style="font-weight:400">${WD[mod(todayJdn+p.left+2,7)]}</div></div></div>`;
}
function section(title,list,note=''){
  return `<div class="card"><h2>${title} <span class="mu">(${fa(list.length)})${note}</span></h2>${
    list.length?list.map(item).join(''):'<div class="empty">موردی وجود ندارد.</div>'}</div>`;
}
const ANI=[['موش','🐭'],['گاو','🐮'],['ببر','🐯'],['خرگوش','🐰'],['اژدها','🐲'],['مار','🐍'],['اسب','🐴'],['بز','🐐'],['میمون','🐵'],['خروس','🐓'],['سگ','🐶'],['خوک','🐷']];
const ZOD=[['حمل','♈'],['ثور','♉'],['جوزا','♊'],['سرطان','♋'],['اسد','♌'],['سنبله','♍'],['میزان','♎'],['عقرب','♏'],['قوس','♐'],['جدی','♑'],['دلو','♒'],['حوت','♓']];
function chineseAnimal(jdn){
  const d=new Date((jdn-2440588)*864e5);let y;
  try{const p=new Intl.DateTimeFormat('en-u-ca-chinese-nu-latn',{year:'numeric',timeZone:'UTC'}).formatToParts(d).find(x=>x.type==='relatedYear');y=+p.value}catch(e){}
  if(!y)y=d.getUTCFullYear();
  return ANI[mod(y-4,12)];
}
const TUR=['موش','گاو','پلنگ','خرگوش','نهنگ','مار','اسب','گوسفند','میمون','مرغ','سگ','خوک'],TE=['🐭','🐮','🐆','🐰','🐋','🐍','🐴','🐑','🐵','🐔','🐶','🐷'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fun(p){
  const a=chineseAnimal(p.bj),z=ZOD[p.bm-1],lived=todayJdn-p.bj,ti=mod(p.by-7,12);
  return `<span class="chip">${a[1]} چینی: ${a[0]}</span><span class="chip">${TE[ti]} سال ترکی: ${TUR[ti]}</span><span class="chip">${z[1]} برج ${z[0]}</span><span class="chip">⏳ ${fa(lived.toLocaleString('en'))} روز</span>${p.age===18?'<span class="chip">🎓 ۱۸ سالگی</span>':''}<button class="chip" data-cp="${esc(p.name)}" data-a="${p.age}">📋 پیام تبریک</button>`;
}
function confetti(){
  const E=['🎉','🎈','🎂','✨','🎁','🥳'];
  for(let i=0;i<30;i++){const s=document.createElement('span');s.className='cf';s.textContent=E[i%E.length];
    s.style.left=Math.random()*100+'vw';s.style.animationDuration=(3+Math.random()*3)+'s';s.style.animationDelay=Math.random()*2+'s';
    document.body.appendChild(s);setTimeout(()=>s.remove(),8000)}
}
let shown=false,view='list';
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{view=b.dataset.v;
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));render()});
$('q').addEventListener('input',render);
const MSG=[(n,a)=>`🎂 تولدت مبارک ${n} عزیز! ${fa(a)} سالگی پر از انرژی، موفقیت و خاطرات خوب برات آرزو می‌کنم 🎉`,
 (n,a)=>`🥳 ${n} جان، ${fa(a)} سالگیت مبارک! امیدوارم امسال پر از رشد و دستاوردهای بزرگ باشه ✨`,
 (n,a)=>`🌟 تولدت مبارک ${n}! همیشه بدرخشی و به همه‌ی هدف‌هات برسی.`];
document.addEventListener('click',e=>{const b=e.target.closest('[data-cp]');if(!b)return;
  const t=MSG[Math.floor(Math.random()*MSG.length)](b.dataset.cp,+b.dataset.a),old=b.textContent;
  const done=()=>{b.textContent='✅ کپی شد';setTimeout(()=>b.textContent=old,1500)};
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(done).catch(()=>{
    const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove();done()})});
function yearView(all){
  return MONTHS.map((mn,i)=>{const l=all.filter(p=>p.bm===i+1).sort((a,b)=>a.bd-b.bd);
    return `<div class="card"><h2>${mn} <span class="mu">(${fa(l.length)})${i+1===T.jm?' · ماه جاری':''}</span></h2>${
      l.length?l.map(p=>`<div class="item"><span>${fa(p.bd)} ${mn} — <span class="n">${esc(p.name)}</span></span><span class="mu">${fa(T.jy-p.by)} ساله در ${fa(T.jy)}</span></div>`).join(''):'<div class="empty">—</div>'}</div>`}).join('');
}
function statsView(all){
  const cnt=Array(12).fill(0);all.forEach(p=>cnt[p.bm-1]++);const mx=Math.max(...cnt);
  const bars=MONTHS.map((m,i)=>`<div class="item"><span style="min-width:75px">${m}</span><div style="flex:1;background:var(--bg);border-radius:6px"><div style="width:${mx?cnt[i]/mx*100:0}%;background:var(--ac);height:14px;border-radius:6px"></div></div><span class="badge">${fa(cnt[i])}</span></div>`).join('');
  const g={};all.forEach(p=>(g[p.bm*100+p.bd]=g[p.bm*100+p.bd]||[]).push(p));
  const shared=Object.values(g).filter(l=>l.length>1).sort((a,b)=>a[0].bm*100+a[0].bd-b[0].bm*100-b[0].bd);
  const an={};all.forEach(p=>{const a=chineseAnimal(p.bj);an[a[1]+' '+a[0]]=(an[a[1]+' '+a[0]]||0)+1});
  const top=Object.entries(an).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const ages=all.map(p=>T.jy-p.by),avg=ages.reduce((a,b)=>a+b,0)/ages.length;
  return `<div class="card"><h2>📊 خلاصه</h2><div class="chips"><span class="chip">👥 ${fa(all.length)} نفر</span>
   <span class="chip">📆 شلوغ‌ترین ماه: ${MONTHS[cnt.indexOf(mx)]} (${fa(mx)} نفر)</span>
   <span class="chip">🎈 میانگین سن: ${fa(avg.toFixed(1))}</span>
   <span class="chip">🐾 پرتکرارترین‌ها: ${top.map(t=>t[0]+' ('+fa(t[1])+')').join('، ')}</span></div></div>
   <div class="card"><h2>تعداد تولد در هر ماه</h2>${bars}</div>
   <div class="card"><h2>🎭 هم‌تولدی‌ها <span class="mu">(${fa(shared.length)} روز مشترک)</span></h2>${
    shared.length?shared.map(l=>`<div class="item"><span class="n">${fa(l[0].bd)} ${MONTHS[l[0].bm-1]}</span><span>${l.map(p=>esc(p.name)).join('، ')}</span></div>`).join(''):'<div class="empty">تولد مشترکی پیدا نشد.</div>'}</div>`;
}
function render(){
  const all=people();if(!all.length){$('out').innerHTML='<div class="card empty">داده‌ی معتبری پیدا نشد؛ ستون تاریخ تولد را بررسی کنید.</div>';return}
  const N=+$('days').value||30;
  pushEvents(all);
  if(view==='year'){$('out').innerHTML=yearView(all);return}
  if(view==='stats'){$('out').innerHTML=statsView(all);return}
  const sorted=[...all].sort((a,b)=>a.left-b.left);
  const near=sorted.filter(p=>p.left<=N);
  const wStart=todayJdn-wdIdx,wEnd=wStart+6; // هفته: شنبه تا جمعه
  const week=all.filter(p=>[T.jy-1,T.jy,T.jy+1].some(y=>{const j=nextOcc(p.bm,p.bd,y).jdn;return j>=wStart&&j<=wEnd}))
    .map(p=>{const j=[T.jy-1,T.jy,T.jy+1].map(y=>nextOcc(p.bm,p.bd,y)).find(o=>o.jdn>=wStart&&o.jdn<=wEnd);
      return{...p,left:j.jdn-todayJdn,age:j.y-p.by}}).sort((a,b)=>a.left-b.left);
  const month=all.filter(p=>p.bm===T.jm).map(p=>{const j=nextOcc(p.bm,p.bd,T.jy);return{...p,left:j.jdn-todayJdn,age:T.jy-p.by}})
    .sort((a,b)=>a.bd-b.bd);
  const tb=sorted.filter(p=>p.left===0);
  if(tb.length&&!shown){shown=true;confetti()}
  $('out').innerHTML=(tb.length?`<div class="banner">🎂 امروز تولد ${tb.map(p=>p.name+' ('+fa(p.age)+' ساله)').join('، ')} است! 🎉</div>`:'')
    +section(`تولدهای پیش رو (${fa(N)} روز آینده)`,near)
    +section('تولدهای این هفته',week)
    +section(`تولدهای ${MONTHS[T.jm-1]} ماه`,month);
}

/* ---------- بارگذاری ---------- */
$('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{try{localStorage.setItem('bd_xlsx',buf2b64(r.result))}catch(e){}load(r.result)};r.readAsArrayBuffer(f)});
(async()=>{
  try{const st=localStorage.getItem('bd_xlsx');if(st){load(b642buf(st));return}}catch(e){}
  const base=location.pathname.split('/').pop().replace(/\.[^.]+$/,'')||'index';
  for(const n of [base+'.xlsx','birthdays.xlsx','data.xlsx']){
    try{const r=await fetch(n);if(r.ok){load(await r.arrayBuffer());return}}catch(e){}
  }
  $('status').textContent='فایل به‌صورت خودکار خوانده نشد؛ لطفاً با دکمه‌ی بالا فایل اکسل را انتخاب کنید.';
})();
</script>
