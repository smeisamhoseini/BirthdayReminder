plugins { id 'com.android.application' }
android {
    namespace 'com.school.birthday'
    compileSdk 34
    defaultConfig {
        applicationId 'com.school.birthday'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs { debug { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.work:work-runtime:2.9.0' }
